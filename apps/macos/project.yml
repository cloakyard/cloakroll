name: CloakRoll
options:
  bundleIdPrefix: com.cloakyard
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    LM_FORCE_LINK_GENERATION: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  CloakRollCore:
    path: Packages/CloakRollCore
targets:
  CloakRoll:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Resources/Info.plist
          - Resources/CloakRoll.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cloakyard.cloakroll
        PRODUCT_NAME: CloakRoll
        CODE_SIGN_ENTITLEMENTS: App/Resources/CloakRoll.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AppAccent
        ENABLE_PREVIEWS: YES
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleName: CloakRoll
        CFBundleDisplayName: CloakRoll
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.photography
        NSHumanReadableCopyright: "CloakRoll is part of Cloakyard. Your camera roll, safely on your Mac."
    dependencies:
      - package: CloakRollCore
        product: MediaModels
      - package: CloakRollCore
        product: MediaCatalog
schemes:
  CloakRoll:
    build:
      targets:
        CloakRoll: all
    run:
      config: Debug
    archive:
      config: Release
